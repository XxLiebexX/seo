# HTTP -> Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name seocontentoptimiser.in www.seocontentoptimiser.in app.seocontentoptimiser.in;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: SEO Content Optimiser (Homepage) + WordPress (/blog) + FastAPI Backend (/api)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seocontentoptimiser.in www.seocontentoptimiser.in app.seocontentoptimiser.in;

    # Cloudflare Origin SSL Certificate
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Main Homepage: SEO Content Optimiser React Application
    root /var/www/seo/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. API Reverse Proxy -> FastAPI on 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time SSE progress streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 2. WordPress accessible at /blog
    location ^~ /blog {
        alias /var/www/seocontentoptimiser.in;
        index index.php index.html;
        try_files $uri $uri/ /blog/index.php?$args;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        }
    }

    # 3. Static Assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 4. React Single Page App Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
